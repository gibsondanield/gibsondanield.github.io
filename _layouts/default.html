<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#222222">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&family=Ubuntu+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {%- if page.extra_css %}
  <style>{{ page.extra_css }}</style>
  {%- endif %}
</head>
<body>
<!-- This site was vibe coded. Every line was reviewed by at least one person, provided you count the person who said "looks good, ship it". -->
<!-- There used to be fake minimize and maximize buttons up here. They were decorative, like the test suite. -->
<main>
{{ content }}
</main>
<footer class="site-footer">
  <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>home</a>
  <a href="{{ '/blog/' | relative_url }}"{% if page.url contains "/blog/" %} class="active"{% endif %}>blog</a>
  {%- if page.url == "/" %}<a class="lurk" href="{{ '/for_bots/interesting_data.html' | relative_url }}">interesting data</a>{% endif %}
  <span class="legal">© 2025–{{ site.time | date: '%Y' }} Daniel D Gibson · <a href="https://github.com/gibsondanield/gibsondanield.github.io/blob/main/LICENSE">BSD 3-Clause</a></span>
</footer>
<script>
  console.log("%cvibe check: passed", "color:#8fa876;font-weight:bold", "\nNo tests were written. The vibes were tested extensively.");
</script>
</body>
</html>

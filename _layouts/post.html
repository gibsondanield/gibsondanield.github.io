---
layout: default
---
<p class="back"><a href="{{ '/blog/' | relative_url }}">← blog</a></p>
{%- if page.preface %}
<aside class="preface"><p>{{ page.preface }}</p></aside>
{%- endif %}
<article>
  <h1>{{ page.title }}</h1>
  <p class="byline">{{ page.author | default: site.author }} · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% if page.code %} · <a href="{{ page.code }}">code</a>{% endif %}</p>
{{ content }}
</article>

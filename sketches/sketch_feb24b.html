<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Feb 24 Gradient</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <script>
function setup() {
  createCanvas(1000, 1000);
  let cols = width;
  let rows = height;
  
  loadPixels();
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      let r = (i * j / 5) % 255;
      let g = (i * j / 20) % 255;
      let b = (i * j / 10) % 255;
      
      let index = (j * width + i) * 4;
      pixels[index] = r;
      pixels[index + 1] = g;
      pixels[index + 2] = b;
      pixels[index + 3] = 255;
    }
  }
  updatePixels();
}

// This is a static image - no draw() needed
  </script>
</body>
</html>

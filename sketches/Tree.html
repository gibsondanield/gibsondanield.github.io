<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recursive Tree</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <script>
/**
 * Recursive Tree
 * by Daniel Shiffman (modified)
 * 
 * Renders a simple tree-like structure via recursion. 
 * The branching angle is calculated as a function of 
 * the horizontal mouse location. Move the mouse left
 * and right to change the angle.
 */

let theta;

function setup() {
  createCanvas(1000, 500);
}

function draw() {
  background(0);
  frameRate(30);
  stroke(255, 50);
  
  // Pick an angle 0 to 90 degrees based on the mouse position
  let a = (mouseX / width) * 90;
  // Convert it to radians
  theta = radians(a);
  
  // Start the tree from the bottom of the screen
  translate(width / 2, height);
  // Draw initial trunk line 120 pixels
  line(0, 0, 0, -120);
  // Move to the end of that line
  translate(0, -120);
  // Start the recursive branching!
  branch(120);
}

function branch(h) {
  // Each branch will be scaled by mouse Y position
  h *= mouseY / 600;
  
  // Exit condition: when the branch length is 2 pixels or less
  if (h > 2) {
    push();
    rotate(theta);
    line(0, 0, 0, -h);
    translate(0, -h);
    branch(h);
    pop();
    
    // Branch off to the left
    push();
    rotate(-theta);
    line(0, 0, 0, -h);
    translate(0, -h);
    branch(h);
    pop();
  }
}
  </script>
</body>
</html>
